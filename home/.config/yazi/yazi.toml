# https://yazi-rs.github.io/docs/configuration/yazi
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml

[mgr]
ratio = [1, 2, 3]
sort_by = "natural"

[preview]
cache_dir = "~/.cache/yazi/"
image_filter = "nearest"

[opener]
image = [
  { run = 'imv_rifle.sh %s', desc = "imv", orphan = true },
]
video = [
  { run = 'mpv %s', desc = "mpv", orphan = true },
  { run = 'mpv --loop-file %s', desc = "mpv (loop)", orphan = true },
]
pdf = [{ run = 'zathura %s', desc = "zathura", orphan = true }]
office = [{ run = 'libreoffice %s', desc = "libreoffice", orphan = true }]
extract = [{ run = 'ya pub extract --list %s', desc = "extract" }]
html = [{ run = '${BROWSER:-firefox} %s', desc = "$BROWSER", orphan = true }]
text = [{ run = '${EDITOR:-vi} %s', desc = "$EDITOR", block = true }]

[open]
rules = [
  { mime = "{{audio,video}/*}", use = [
    "video",
  ] },
  { mime = "image/*", use = [
    "image",
  ] },
  { mime = "application/pdf", use = [
    "pdf",
  ] },
  { mime = "application/{oasis.opendocument,openxmlformats-officedocument}.*", use = [
    "office",
  ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz}", use = [
    "extract",
  ] },
  { mime = "text/html", use = [
    "text",
    "html",
  ] },
  { mime = "{text/*,inode/empty,application/{json,ndjson},application/javascript}", use = [
    "text",
  ] },
]

[plugin]
prepend_fetchers = [
  { id = "mime", url = "local://*.{mp3,mp4,png,jpg,jpeg,webp,part*}", run = "mime-ext.local", prio = "high", group = "mime" },
  { id = "mime", url = "remote://*.{mp3,mp4,png,jpg,jpeg,webp,part*}", run = "mime-ext.remote", prio = "high", group = "mime" },
  { id = "simple-tag", url = "*", run = "simple-tag", group = "simple-tag" },
  { id = "simple-tag", url = "*/", run = "simple-tag", group = "simple-tag" },
]
